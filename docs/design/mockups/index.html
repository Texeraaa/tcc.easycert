<!doctype html>
<html lang="pt-BR" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easycert - protótipo</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
<style>
:root{
  --background:#fafafa;--foreground:#09090b;--muted:#f4f4f5;--muted-foreground:#71717a;
  --border:#e4e4e7;--input:#e4e4e7;--accent:#27592e;--accent-foreground:#fafafa;
  --accent-muted:rgba(39,89,46,.10);--destructive:#dc2626;--warning:#d97706;--ring:#27592e;
  --card:#ffffff;
  --shadow-sm:0 1px 2px rgba(24,24,27,.05);--shadow-md:0 4px 12px rgba(24,24,27,.08);--shadow-lg:0 12px 32px rgba(24,24,27,.12);
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --font-sans:"Satoshi",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --row-y:12px;--row-x:16px;
}
[data-theme=dark]{
  --background:#09090b;--foreground:#fafafa;--muted:#18181b;--muted-foreground:#a1a1aa;
  --border:#27272a;--input:#27272a;--accent:#4a9b58;--accent-foreground:#09090b;
  --accent-muted:rgba(74,155,88,.15);--destructive:#ef4444;--warning:#f59e0b;--ring:#4a9b58;
  --card:#0e0e11;
}
[data-density=compact]{--row-y:8px;--row-x:12px}
*{box-sizing:border-box}
html{color-scheme:light}
[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ph,.ph-fill{display:inline-block;vertical-align:-.125em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-foreground);padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid transparent;background:transparent;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn i{font-size:16px}
.btn-primary{background:var(--accent);color:var(--accent-foreground)}
.btn-outline{border-color:var(--border);background:var(--background)}
.btn-ghost{color:var(--muted-foreground)}
.btn-destructive{border-color:var(--border);color:var(--destructive);background:var(--background)}
.btn-lg{height:44px;padding:0 20px;font-size:15px}
.btn-icon{width:32px;height:32px;padding:0}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
  .btn-outline:hover,.btn-ghost:hover{background:var(--muted);color:var(--foreground)}
  .btn-destructive:hover{background:rgba(220,38,38,.08)}
}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100dvh;transition:grid-template-columns 240ms var(--ease-drawer)}
.shell.collapsed{grid-template-columns:60px 1fr}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--border);background:var(--background);display:flex;flex-direction:column;padding:12px 8px;gap:4px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand i{color:var(--accent);font-size:22px}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;color:var(--muted-foreground);background:none;border:0;cursor:pointer;width:100%;text-align:left;white-space:nowrap;font-weight:500;transition:background-color 150ms ease,color 150ms ease}
.nav-item i{font-size:20px;flex:none}
.nav-item[aria-current=page]{background:var(--accent-muted);color:var(--accent)}
.nav-count{margin-left:auto;font-size:12px}
@media (hover:hover) and (pointer:fine){.nav-item:hover{background:var(--muted);color:var(--foreground)}.nav-item[aria-current=page]:hover{background:var(--accent-muted);color:var(--accent)}}
.collapsed .lbl,.collapsed .nav-count,.collapsed .side-foot .seg,.collapsed .who-text{display:none}
.side-sp{flex:1}
.side-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--border);padding-top:10px}
.seg{display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--muted);border-radius:6px}
.seg-title{font-size:12px;color:var(--muted-foreground);padding:2px 6px}
.seg button{height:28px;border:0;background:none;border-radius:4px;text-align:left;padding:0 8px;cursor:pointer;color:var(--muted-foreground);font-weight:500}
.seg button[aria-pressed=true]{background:var(--background);color:var(--foreground);box-shadow:var(--shadow-sm)}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px}
.avatar{width:28px;height:28px;border-radius:9999px;background:var(--accent-muted);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.main{min-width:0}
.topbar{display:none}
.mock-chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;background:var(--muted);color:var(--muted-foreground);font-family:var(--font-mono);font-size:12px}

/* page */
.page{margin:0 auto;padding:32px 24px 48px;max-width:64rem}
.page.wide{max-width:none}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.page h1{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.015em}
.page h1.hero{font-size:30px}
.lede{color:var(--muted-foreground);max-width:65ch;margin-top:4px}
.stack{display:flex;flex-direction:column;gap:24px}
.coord .stack{gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px}
.card-pad{padding:20px}
h2{font-size:18px;font-weight:700;line-height:1.3}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted-foreground)}

/* forms */
.grid-form{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500}
.hint{font-size:12px;color:var(--muted-foreground)}
.input,select.input,textarea.input{height:40px;border:1px solid var(--input);border-radius:6px;background:var(--background);padding:0 12px;width:100%;transition:border-color 150ms ease}
textarea.input{height:88px;padding:10px 12px;resize:vertical}
.input:focus-visible{outline:2px solid var(--ring);outline-offset:0;border-color:var(--ring)}
.input[aria-invalid=true]{border-color:var(--destructive)}
.err{display:none;align-items:center;gap:6px;color:var(--destructive);font-size:13px}
.err.show{display:flex}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{border:1px dashed var(--input);border-radius:6px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;background:var(--muted);transition:border-color 150ms ease,background-color 150ms ease}
.drop i{font-size:24px;color:var(--muted-foreground)}
.drop.has{border-style:solid;background:var(--accent-muted);border-color:var(--accent)}
.drop.has i{color:var(--accent)}
@media (hover:hover){.drop:hover{border-color:var(--muted-foreground)}}
.form-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}

/* progress */
.bar{height:8px;background:var(--muted);border-radius:9999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:9999px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}

/* badge */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--muted);color:var(--muted-foreground)}
.badge i{font-size:14px}
.b-Pendente{color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent)}
.b-Aprovada,.b-Emitido{color:var(--accent);background:var(--accent-muted)}
.b-Indeferida{color:var(--destructive);background:color-mix(in srgb,var(--destructive) 10%,transparent)}
.b-Emanalise,.b-Rascunho{color:var(--muted-foreground)}
.t-Pendente{color:var(--warning)}.t-Aprovada{color:var(--accent)}.t-Indeferida{color:var(--destructive)}

/* submissions list */
.sub{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 16px;align-items:center}
.sub+.sub{border-top:1px solid var(--border)}
.sub .t{font-weight:500}
.sub .meta{font-size:12px;color:var(--muted-foreground);display:flex;gap:12px;flex-wrap:wrap}
.reason{grid-column:1/-1;font-size:13px;color:var(--muted-foreground);display:flex;gap:6px;align-items:flex-start}

/* declaration document */
.doc{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);display:grid;grid-template-columns:1fr 172px;gap:28px;padding:32px;position:relative}
.doc-head{display:flex;align-items:center;gap:10px;color:var(--accent);margin-bottom:20px}
.doc-head i{font-size:28px}
.doc h2{font-size:20px;color:var(--foreground)}
.doc p.body{max-width:65ch;font-size:16px;line-height:1.65}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:20px 0 0;font-size:14px}
.doc dt{color:var(--muted-foreground)}
.doc dd{margin:0}
.qr{background:#fafafa;border:1px solid var(--border);border-radius:6px;padding:10px;width:172px}
.qr svg{display:block;width:100%;height:auto}
.qr-cap{font-size:12px;color:var(--muted-foreground);margin-top:8px;text-align:center}
.qr-code{font-family:var(--font-mono);font-size:12px;text-align:center;margin-top:2px}
.doc-foot{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}

/* coord */
.banner{display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;background:color-mix(in srgb,var(--warning) 10%,transparent);color:var(--foreground);border:1px solid color-mix(in srgb,var(--warning) 35%,transparent)}
.banner i{color:var(--warning);font-size:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted-foreground);font-weight:500;cursor:pointer;white-space:nowrap;transition:color 150ms ease}
.tab[aria-selected=true]{color:var(--foreground);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;background:var(--muted);border-radius:9999px;padding:0 7px;color:var(--muted-foreground)}
@media (hover:hover){.tab:hover{color:var(--foreground)}}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative;width:340px;max-width:100%}
.search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);font-size:16px}
.search .input{height:34px;padding-left:34px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9999px;border:1px solid var(--border);background:var(--background);cursor:pointer;font-weight:500;font-size:13px;color:var(--muted-foreground);transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease}
.chip[aria-pressed=true]{background:var(--accent-muted);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tbl-wrap{border:1px solid var(--border);border-radius:6px;overflow:auto;background:var(--card)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--muted-foreground);padding:10px var(--row-x);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
td{padding:var(--row-y) var(--row-x);vertical-align:middle}
tbody tr{cursor:pointer;transition:background-color 150ms ease}
tbody tr.sel{background:var(--accent-muted)}
[data-input=kbd] tbody tr{transition:none}
@media (hover:hover) and (pointer:fine){tbody tr:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}tbody tr.sel:hover{background:var(--accent-muted)}}
.r{text-align:right}.c{text-align:center}
.who2{display:flex;flex-direction:column;line-height:1.35}
.who2 b{font-weight:500}
.who2 span{font-size:12px;color:var(--muted-foreground)}
.row-actions{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity 150ms ease}
tr:hover .row-actions,tr.sel .row-actions,tr:focus-within .row-actions{opacity:1}
.cb{appearance:none;width:16px;height:16px;border:1px solid var(--muted-foreground);border-radius:4px;background:var(--background);cursor:pointer;display:grid;place-content:center;margin:0}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-foreground);border-bottom:2px solid var(--accent-foreground);transform:rotate(-45deg) translate(1px,-1px)}
.empty{padding:48px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty i{font-size:24px;color:var(--muted-foreground)}
.cards-m{display:none}
.kbd-hint{font-size:12px;color:var(--muted-foreground);display:flex;gap:12px;flex-wrap:wrap}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--muted)}

/* sheet and dialog */
.scrim{position:fixed;inset:0;background:rgba(9,9,11,.28);opacity:0;pointer-events:none;transition:opacity 180ms ease;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--background);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform 180ms var(--ease-drawer);z-index:50;display:flex;flex-direction:column}
.sheet.open{transform:none;transition-duration:240ms}
.sheet-head{display:flex;justify-content:space-between;gap:12px;padding:20px;border-bottom:1px solid var(--border)}
.sheet-body{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:20px}
.sheet-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.pdf{aspect-ratio:16/9;border:1px solid var(--border);border-radius:6px;background:var(--muted);display:grid;place-items:center;color:var(--muted-foreground);text-align:center;font-size:13px}
.pdf i{font-size:32px;display:block;margin:0 auto 4px}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0}
.dl dt{color:var(--muted-foreground)}.dl dd{margin:0}
[data-input=kbd] .sheet,[data-input=kbd] .scrim,[data-input=kbd] .dialog{transition-duration:0s!important}
.dialog{position:fixed;left:50%;top:50%;width:440px;max-width:calc(100% - 32px);background:var(--background);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);padding:20px;z-index:60;opacity:0;transform:translate(-50%,-50%) scale(.95);pointer-events:none;transition:opacity 120ms var(--ease-out),transform 120ms var(--ease-out)}
.dialog.open{opacity:1;transform:translate(-50%,-50%);pointer-events:auto;transition-duration:200ms}
.dialog .form-actions{padding-top:16px}

/* toast */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--foreground);color:var(--background);border-radius:8px;box-shadow:var(--shadow-lg);animation:tin 300ms var(--ease-out)}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.95)}}

/* admin */
.next{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px;border-radius:6px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-muted)}
.next h2{font-size:20px}
.admin-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.legend-row{display:grid;grid-template-columns:110px 1fr 44px;gap:12px;align-items:center;font-size:13px;padding:5px 0}
.legend-row .bar{height:10px}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--muted-foreground)}
.old-list{display:flex;flex-direction:column}
.old-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0}
.old-item+.old-item{border-top:1px solid var(--border)}

/* mobile nav */
.tabbar{display:none}
@media (max-width:1023px){
  .banner{display:flex}
  .coord .btn-lg{height:40px}
  .coord-actions{display:none!important}
}
@media (max-width:767px){
  .shell,.shell.collapsed{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform 240ms var(--ease-drawer);z-index:70;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .shell.collapsed .lbl,.shell.collapsed .nav-count,.shell.collapsed .side-foot .seg,.shell.collapsed .who-text{display:revert}
  .shell.collapsed .nav-count{display:inline}
  .collapse-btn{display:none!important}
  .topbar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--background);z-index:30}
  .page{padding:20px 16px 88px}
  .page-head{flex-direction:column}
  .grid-form,.admin-grid{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .doc{grid-template-columns:1fr;padding:20px}
  .qr{width:160px}
  .next{flex-direction:column;align-items:stretch}
  .tbl-wrap{display:none}
  .cards-m{display:flex;flex-direction:column;gap:8px}
  .mcard{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;align-items:flex-start}
  .tabbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;background:var(--background);border-top:1px solid var(--border);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{height:56px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted-foreground);font-weight:500}
  .tabbar button i{font-size:22px}
  .tabbar button[aria-current=page]{color:var(--accent)}
  .toasts{left:16px;right:16px;bottom:72px}
  .search{width:100%}
  .doc-foot .btn{flex:1}
  .legend-row{grid-template-columns:90px 1fr 40px}
}

/* certificados */
.shell.pub,.shell.pub.collapsed{display:block}
.pub .side,.pub .topbar,.pub .tabbar{display:none}
.pubwrap{max-width:36rem;margin:0 auto;padding:24px 20px 64px}
.pubhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.pubwrap h1{font-size:24px;font-weight:700;letter-spacing:-.015em}
.verdict{display:flex;gap:12px;align-items:flex-start}
.verdict i{font-size:28px;color:var(--destructive);flex:none}
.verdict.ok i{color:var(--accent)}
.card.bad{border-color:color-mix(in srgb,var(--destructive) 40%,transparent)}
.list-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:14px 16px;cursor:pointer;transition:background-color 150ms ease}
.list-row+.list-row{border-top:1px solid var(--border)}
@media (hover:hover) and (pointer:fine){.list-row:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}}
.list-row .t{font-weight:500}
.list-row .meta{font-size:12px;color:var(--muted-foreground);display:flex;gap:12px}
.ico{width:36px;height:36px;border-radius:6px;background:var(--accent-muted);color:var(--accent);display:grid;place-items:center;font-size:20px}
.step-i{display:grid;grid-template-columns:auto 1fr;gap:10px;color:var(--muted-foreground)}
.step-i i{font-size:20px;color:var(--accent)}
.items{list-style:none;padding:0;margin:16px 0 0;max-width:65ch;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border)}
.tabbar[hidden]{display:none!important}
@media (max-width:767px){.hide-m{display:none}.list-row{grid-template-columns:auto 1fr auto}.pubhead{margin-bottom:24px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .sheet,.dialog{transform:none}
  .sheet:not(.open){visibility:hidden}
}
</style>
</head>
<body>

/* ---------- certificado (detalhe com QRCode) ---------- */
function qrSvg(seed){
  const N=25;let s=seed;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  const g=Array.from({length:N},()=>Array.from({length:N},()=>rnd()>.5));
  const fin=(x,y)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const X=x+i,Y=y+j;if(X<0||Y<0||X>=N||Y>=N)continue;
    const edge=i===-1||j===-1||i===7||j===7;const ring=i===0||j===0||i===6||j===6;const core=i>=2&&i<=4&&j>=2&&j<=4;g[Y][X]=edge?false:(ring||core)}};
  fin(0,0);fin(N-7,0);fin(0,N-7);
  let d='';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x])d+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="QRCode de verificação" shape-rendering="crispEdges"><path d="${d}" fill="#09090b"/></svg>`;
}
const seedOf=c=>[...c].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);

  const c=certBy(S.param)||CERTS[0];

const late=r=>(r.st==='Pendente')&&age(r.env)>5;
function filtered(){
  let r=ROWS.filter(x=>x.st==='Pendente'||x.st==='Em análise');
  if(S.tab==='atrasadas')r=r.filter(late);
  if(S.tab==='minha')r=r.filter(x=>x.mine);
  if(S.cats.size)r=r.filter(x=>S.cats.has(x.cat));
  const q=S.q.trim().toLowerCase();
  if(q)r=r.filter(x=>(x.aluno+' '+x.ativ+' '+x.mat).toLowerCase().includes(q));
  return r.sort((a,b)=>dt(a.env)-dt(b.env));
}
function counts(){const open=ROWS.filter(x=>x.st==='Pendente'||x.st==='Em análise');return{todas:open.length,atrasadas:open.filter(late).length,minha:open.filter(x=>x.mine).length}}

function openSheet(id,kbd){

      <div class="pdf"><div>${ic('file-pdf')}comprovante-de-participacao.pdf<br><span class="mono">1 página, 240 KB [mock]</span></div></div>
      <div class="field coord-actions"><label for="aceita">Carga horária no certificado</label><input class="input mono" id="aceita" type="number" min="1" value="${r.h}" style="max-width:160px"><span class="hint">Valor informado pelo aluno. Ajuste se necessário.</span></div>
    </div>

function closeSheet(){S.open=null;const sh=$('#sheet');sh.classList.remove('open');sh.setAttribute('aria-hidden','true');$('#scrim').classList.remove('open')}
function approve(id,h){
  const r=ROWS.find(x=>x.id===id);const prev=r.st;r.st='Aprovada';
  const cert={code:genCode(),aluno:r.aluno,mat:r.mat,curso:r.curso,titulo:r.ativ,cat:r.cat,h:h||r.h,em:'27/10/2026'};
  CERTS.push(cert);
  closeSheet();S.sel=-1;refresh();
  toast(`Aprovada: certificado emitido para ${r.aluno}.`,{label:'Desfazer',fn:()=>{r.st=prev;CERTS.splice(CERTS.indexOf(cert),1);refresh()}});
}
function openReject(id){
  const r=ROWS.find(x=>x.id===id);const d=$('#dialog');
  d.innerHTML=`<h2 id="dlgTitle">Indeferir solicitação</h2>
    <p class="muted" style="margin-top:4px">${esc(r.aluno)}, ${esc(r.ativ)}. O aluno verá o motivo na página dele.</p>

    <div class="form-actions"><button class="btn btn-outline" id="dlgNo">Cancelar</button><button class="btn btn-destructive" id="dlgOk">Indeferir</button></div>`;
  d.classList.add('open');$('#scrim').classList.add('open');
  setTimeout(()=>$('#motivo').focus(),0);
  $('#dlgNo').onclick=closeDialog;
  $('#dlgOk').onclick=()=>{
    if(!$('#motivo').value.trim()){$('#e-mot').classList.add('show');$('#motivo').setAttribute('aria-invalid','true');return}
    const prev=r.st;r.st='Indeferida';closeDialog();closeSheet();S.sel=-1;refresh();
    toast(`Indeferida: ${r.aluno}.`,{label:'Desfazer',fn:()=>{r.st=prev;refresh()}});
  };
}
function closeDialog(){$('#dialog').classList.remove('open');if(!S.open)$('#scrim').classList.remove('open')}

document.addEventListener('pointerdown',()=>{document.documentElement.dataset.input='mouse'});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key==='Escape'){
    document.documentElement.dataset.input='kbd';
    if($('#dialog').classList.contains('open')){closeDialog();return}
    if(S.open){closeSheet();return}
    $('#side').classList.remove('open');return;
  }
  if(typing||S.view!=='fila'||innerWidth<1024)return;
  const rows=filtered();
  if(e.key==='j'||e.key==='k'){
    e.preventDefault();document.documentElement.dataset.input='kbd';
    S.sel=Math.max(0,Math.min(rows.length-1,S.sel+(e.key==='j'?1:-1)));
    document.querySelectorAll('tbody tr').forEach((tr,i)=>tr.classList.toggle('sel',i===S.sel));
    const el=document.querySelectorAll('tbody tr')[S.sel];if(el)el.scrollIntoView({block:'nearest'});
    if(S.open&&rows[S.sel])openSheet(rows[S.sel].id,true);
  }else if(e.key==='Enter'&&S.sel>=0&&!S.open&&rows[S.sel]){e.preventDefault();openSheet(rows[S.sel].id,true)}
  else if((e.key==='r'||e.key==='R')&&(S.open||S.sel>=0)){e.preventDefault();document.documentElement.dataset.input='kbd';openReject(S.open||rows[S.sel].id)}
});

        <input class="input mono" id="vc" value="${esc(code)}" placeholder="EC-XXXX-XXXX" autocomplete="off" spellcheck="false" aria-describedby="e-vc">
        <div class="err" id="e-vc" role="alert">${ic('warning-circle')}Informe o código do certificado.</div></div>
      <div><button class="btn btn-primary btn-lg" type="submit">Verificar</button></div>
    </form>
    <div id="vres" aria-live="polite" style="margin-top:24px"></div>
    <p class="hint" style="margin-top:32px">Exemplos [mock]: <button class="btn btn-ghost" data-ex="EC-7F3K-92QD" style="height:24px;padding:0 6px">código válido</button><button class="btn btn-ghost" data-ex="EC-0000-0000" style="height:24px;padding:0 6px">código inexistente</button></p>
  </div>`;
  const run=v=>{
    v=v.trim().toUpperCase();
    $('#e-vc').classList.toggle('show',!v);$('#vc').setAttribute('aria-invalid',!v);
    if(!v){$('#vres').innerHTML='';return}
    S.param=v;setHash();
    const c=certBy(v);
    $('#vres').innerHTML=c?`<div class="card card-pad stack" style="gap:16px">
        <div class="verdict ok">${ic('seal-check',true)}<div><h2>Certificado válido</h2><p class="muted">Emitido pela faculdade e registrado no easycert.</p></div></div>
        <dl class="dl"><dt>Titular</dt><dd>${esc(c.aluno)}</dd><dt>Certificado</dt><dd>${esc(c.titulo)}</dd><dt>Curso</dt><dd>${c.curso}</dd><dt>Carga horária</dt><dd class="mono">${c.h} h</dd><dt>Emitido em</dt><dd class="mono">${c.em}</dd><dt>Código</dt><dd class="mono">${c.code}</dd></dl></div>`
      :`<div class="card card-pad stack bad" style="gap:8px"><div class="verdict">${ic('warning-circle',true)}<div><h2>Código não encontrado</h2><p class="muted">Confira se digitou todos os caracteres, com hífens e sem espaços. Se o erro continuar, fale com a secretaria do curso.</p></div></div></div>`;
  };
  $('#vf').onsubmit=e=>{e.preventDefault();run($('#vc').value)};
  m.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{$('#vc').value=b.dataset.ex;run(b.dataset.ex)});
  $('#exitPub').onclick=()=>setRole('aluno');
  if(code)run(code);
}

/* eventos globais da shell */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const r=e.target.closest('[data-role]');if(r){setRole(r.dataset.role);return}
  if(e.target.closest('#themeBtn')){toggleTheme();return}
  if(e.target.closest('#densBtn')){toggleDensity();return}
  if(e.target.closest('#colBtn')){S.collapsed=!S.collapsed;renderSide();return}
  if(e.target.closest('#menuBtn')){$('#side').classList.toggle('open');return}
});

(function init(){
  const th=getCookie('easycert.theme'),dn=getCookie('easycert.density');
  if(th)S.theme=th;if(dn)S.density=dn;
  const h=location.hash.replace('#','').split('/');
  if(VIEWS[h[0]]){S.role=h[0];S.view=VIEWS[h[0]].includes(h[1])?h[1]:FIRST[h[0]];S.param=h[2]||null}
  const qp=new URLSearchParams(location.search);
  if(qp.get('theme'))S.theme=qp.get('theme');if(qp.get('density'))S.density=qp.get('density');
  applyTheme();renderSide();renderView();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();renderSide()});
})();
})();
</script>
</body>
</html>
