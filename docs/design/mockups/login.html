<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrar · easycert</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("easycert.theme");
        const sys = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", stored || sys);
      } catch { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
  <link rel="stylesheet" href="_shared.css" />
</head>
<body>
  <!-- toggle de tema flutuante -->
  <div style="position:fixed;top:16px;right:16px;z-index:10">
    <button class="btn btn--ghost btn--sm" data-theme-toggle aria-pressed="false">
      <i data-theme-icon class="ph ph-moon"></i>
      <span data-theme-label>Escuro</span>
    </button>
  </div>

  <div class="auth-wrap">
    <div class="auth-card enter">
      <div class="brand" style="margin-bottom:20px">
        <span class="brand__mark">e</span>
        easycert
      </div>

      <h1 class="text-xl font-bold" style="letter-spacing:-0.015em;margin:0 0 4px">Entrar</h1>
      <p class="text-sm text-muted" style="margin:0 0 20px">Acesse com seu e-mail institucional da FMPFM.</p>

      <form class="stack-4" onsubmit="return false">
        <div class="field">
          <label class="label" for="email">E-mail institucional</label>
          <input id="email" class="input" type="email" value="ana.oliveira@fmpfm.edu.br" autocomplete="username" />
        </div>

        <div class="field">
          <div class="row-between">
            <label class="label" for="senha">Senha</label>
            <a href="#" class="text-xs text-muted" style="text-decoration:underline;text-underline-offset:3px">Esqueceu?</a>
          </div>
          <input id="senha" class="input" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <label class="row" style="cursor:pointer">
          <div class="checkbox" role="checkbox" aria-checked="true"></div>
          <span class="text-sm">Manter conectado neste dispositivo</span>
        </label>

        <button class="btn btn--primary btn--lg" type="submit" style="width:100%" data-toast='{"title":"Entrando...","desc":"Isto é só um mockup.","icon":"spinner","variant":"accent"}'>
          Entrar
        </button>
      </form>

      <div class="divider"></div>

      <p class="text-xs text-muted" style="text-align:center;margin:0">
        Problemas de acesso? Fale com a coordenação do curso.
      </p>
    </div>
  </div>

  <script src="_shared.js"></script>
  <script>
    document.addEventListener("click", (e) => {
      const cb = e.target.closest(".checkbox");
      if (!cb) return;
      cb.setAttribute("aria-checked", cb.getAttribute("aria-checked") === "true" ? "false" : "true");
    });
  </script>
</body>
</html>
