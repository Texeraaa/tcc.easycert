services:
  postgres:
    image: postgres:16-alpine
    container_name: easycert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: easycert
      POSTGRES_PASSWORD: easycert
      POSTGRES_DB: easycert
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easycert"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
